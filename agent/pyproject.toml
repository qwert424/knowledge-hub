[project]
name = "knowledge-hub-agent"
version = "0.1.0"
description = "Knowledge Hub RAG Engine (FastAPI) + Redis Stream index worker"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "pymilvus>=2.5",
    "redis>=5.0",
    "numpy>=1.26",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "orjson>=3.10",
    "neo4j>=6.4.1",
    "opensandbox>=1.2.1",
]

[project.scripts]
kh-engine = "knowledge_hub.api.main:run"
kh-worker = "knowledge_hub.worker.main:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "knowledge_hub"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
