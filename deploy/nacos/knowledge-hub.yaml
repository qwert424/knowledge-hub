# Nacos 配置：dataId=knowledge-hub.yaml, group=DEFAULT_GROUP, namespace=public
# 引擎启动时读取；值支持 ${ENV_VAR:default} 形式，由运行环境覆盖
llm:
  chat_model: ${OPENAI_DEFAULT_MODEL:gpt-4.1-mini}
  base_url: ${LITELLM_BASE_URL:http://127.0.0.1:4000/v1}
  temperature: 0.2
  max_tokens: 2048

embedding:
  model: ${OPENAI_EMBEDDING_MODEL:text-embedding}
  dimensions: ${EMBEDDING_DIM:1024}
  batch_size: 10
  encoding_format: float

chunking:
  template: general
  chunk_size: 1000
  chunk_overlap: 200
  min_chunk_chars: 40
  quality:
    min_tokens: 20
    max_tokens: 1200
    drop_pure_navigation: true

retrieval:
  dense:
    enabled: true
    top_k: 20
    metric: COSINE
    index: HNSW
  sparse:
    enabled: true
    top_k: 20
  fusion:
    strategy: rrf
    k: 60
  rerank:
    enabled: false
    strategy: rrf
    top_n: 8
  graph:
    enabled: true
    hops: 2
    include_communities: true
  top_k: 8

jev:
  enabled: true
  # JEV 是"受限选择"的小决策模型：只输出 JSON，用它做路由/判定比用大模型便宜也更快。
  # 默认走网关里的 jev-basic 别名；也可以在管理端「检索策略」里改。
  model: ${JEV_MODEL:jev-basic}
  timeout_ms: 3000
  min_confidence: 0.55
  scenes:
    router: true
    judge: true
    chunk_quality: false
    conflict: false

index:
  max_concurrency: 2
  embedding_batch_size: 16
  snapshot_prefix: snapshots

# Nacos AI 注册表里的 AgentSpec 名称；提示词、模型、工具、子 Agent 都在那边维护。
# 引擎拿不到 spec 时用内置提示词兜底，并在 /health 里标记 degraded。
agent:
  name: main_agent
  label: product
  fallback_prompt: ""
  # 可选：给确定性检索链路的补充策略（Nacos prompt 资源名，留空则只用内置规则）
  chat_policy_prompt: ""
  # ---- 中间件开关（改完 POST /v1/admin/reload 或等下一次配置刷新生效）----
  # 规划：回答前先产出一份简短计划（要查什么、要调哪个工具），结构化 JSON、4s 预算
  plan_enabled: true
  # 复核：答案产完后自查（答非所问 / 编造 / 泄露风险），判为 need_fix 时改写一次
  review_enabled: true
  # 安全扫描：命中系统提示词回显、密钥样式、内部地址等直接拦截并换成安全答复
  security_scan_enabled: true
