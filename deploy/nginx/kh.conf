# Knowledge Hub - reverse proxy (nginx)
#
# Three virtual hosts, all served by the same nginx container / host:
#   portal.kh.local  -> kh-portal:3000   (user workbench)
#   admin.kh.local   -> kh-admin:3000    (management console)
#   api.kh.local     -> kh-backend:8088  (REST + SSE)
#
# Start nginx on the compose network, e.g.:
#   docker run -d --name kh-nginx --network kh_net -p 8080:80 \
#     -v <repo>/deploy/nginx/kh.conf:/etc/nginx/conf.d/default.conf:ro nginx:1.27-alpine
#
# NOTE: host port 8080 is already used by the reused Nacos console - map something else
#       (8081/8089) or put nginx behind your own load balancer.

upstream kh_portal { server kh-portal:3000; keepalive 32; }
upstream kh_admin  { server kh-admin:3000;  keepalive 32; }
upstream kh_api    { server kh-backend:8088; keepalive 64; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Shared proxy defaults for the two Next.js apps.
server {
    listen 80;
    server_name portal.kh.local;

    client_max_body_size 200m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml application/xml+rss
               image/svg+xml font/woff2;

    location / {
        proxy_pass http://kh_portal;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name admin.kh.local;

    client_max_body_size 200m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml application/xml+rss
               image/svg+xml font/woff2;

    location / {
        proxy_pass http://kh_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }
}

# ------------------------------------------------------------------ API / SSE
server {
    listen 80;
    server_name api.kh.local;

    client_max_body_size 200m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    # text/event-stream is intentionally NOT in gzip_types.
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml application/xml+rss;

    # SSE: the chat stream. Buffering must be off end-to-end or tokens arrive in bursts.
    location = /api/v1/chat/stream {
        proxy_pass http://kh_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no always;
    }

    # Any other streaming endpoint (feedback, eval progress) gets the same treatment.
    location ~ ^/api/v1/(chat/.*/stream|.*/stream)$ {
        proxy_pass http://kh_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering no always;
    }

    location / {
        proxy_pass http://kh_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Actuator stays internal-ish: expose only health to the outside.
    location /actuator/ {
        proxy_pass http://kh_api;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location = /swagger-ui.html {
        proxy_pass http://kh_api;
        proxy_set_header Host $host;
    }
}

# Default host: makes plain `http://<host>/` usable in a pinch (portal).
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 200m;

    location / {
        proxy_pass http://kh_portal;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
